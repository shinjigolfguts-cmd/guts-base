name: Catalog and image checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalog counts, image hashes, links and tracking configuration
        run: node scripts/check-static.mjs
      - name: Check JavaScript syntax
        run: |
          node --check catalog.js
          node --check app.js
          node --check selection.js
          node --check guts-analytics.js
