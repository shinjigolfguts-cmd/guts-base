name: Catalog and image checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 10:30 JST, after the 09:00 content update window.
    - cron: '30 1 * * 1'
permissions:
  contents: read
concurrency:
  group: catalog-and-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalog counts, image hashes, links and tracking configuration
        run: node scripts/check-static.mjs
      - name: Test source audit classification and failure handling offline
        run: python3 -m unittest discover -s tests -p test_source_health.py
      - name: Test modal keyboard focus restoration
        run: node --test scripts/test-modal-focus.mjs
      - name: Test catalog price filters and sort consistency offline
        run: node --test scripts/test-catalog-prices.mjs
      - name: Test static discovery cards against catalog offline
        run: python3 -m unittest discover -s tests -p test_discovery_consistency.py
      - name: Test favorites guidance and saved-state feedback offline
        run: node --test scripts/test-favorites-ui.mjs
      - name: Check JavaScript syntax
        run: |
          node --check catalog.js
          node --check app.js
          node --check selection.js
          node --check guts-analytics.js
  live:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for Pages and verify published files
        shell: bash
        run: |
          for attempt in {1..12}; do
            if python3 scripts/check-live.py --output "$RUNNER_TEMP/guts-live-report.json"; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 15
            fi
          done
          exit 1
      - name: Save live release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-release-report-${{ github.sha }}
          path: ${{ runner.temp }}/guts-live-report.json
          if-no-files-found: error
          retention-days: 14
